name: BelgiumPD Code Checks

on:
  push:
    branches:
      - main
      - feature/test-personeel-toevoegen-20261019
      - feature/verlofmodule-test
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js tests and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check core syntax
        run: npm run check
      - name: Check leave-module syntax
        run: |
          node --check src/leave-policy.js
          node --check src/leave-routes.js
          node --check src/discord-portal-access.js
          node --check src/discord-oauth.js
          node --check src/role-routes.js
          node --check public/portal-login.js
          node --check tests/leave-policy.test.js
          node --check tests/leave-routes.test.js
      - name: Execute automated tests
        run: npm test
      - name: Collect syntax and test diagnostics
        if: failure()
        shell: bash
        run: |
          npm run check > test-diagnostics.txt 2>&1 || true
          npm test >> test-diagnostics.txt 2>&1 || true
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: node-test-diagnostics
          path: test-diagnostics.txt

      - name: Inspect public Discord login readiness
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 40 'https://belgiepd-beheerportaal.onrender.com/auth/discord/status' > discord-check.json
          node --input-type=module -e "
          import fs from 'node:fs';
          const s=JSON.parse(fs.readFileSync('discord-check.json','utf8'));
          console.log('Discord OAuth configured in production: '+Boolean(s.ready));
          console.log('Discord portal login already enabled: '+Boolean(s.portalLoginEnabled));
          if(!s.ready) process.exit(1);
          "
      - name: Read-only Render testserver health check
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          url='https://belgiepd-beheerportaal-testserver.onrender.com/api/health'
          echo "Checking Render testserver /api/health without credentials"
          curl --fail --silent --show-error --location --max-time 75 --retry 1 --retry-delay 3 "$url" > health-response.json
          node --input-type=module -e "import fs from 'node:fs'; const h=JSON.parse(fs.readFileSync('health-response.json','utf8')); if(h.status!=='ok') process.exit(1); console.log('Render health: ok; integration: '+String(h.integration||'unknown'));"
      - name: Inspect public Firebase configuration on Render testserver
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          url='https://belgiepd-beheerportaal-testserver.onrender.com/api/client-config'
          curl --fail --silent --show-error --location --max-time 35 "$url" > firebase-config-check.json
          node --input-type=module -e "
          import fs from 'node:fs';
          const c=JSON.parse(fs.readFileSync('firebase-config-check.json','utf8'));
          console.log('Firebase client configuration enabled: '+Boolean(c.enabled));
          console.log('Expected isolated test project: '+Boolean(c.firebaseConfig?.projectId==='belgiepd-test'));
          if(!c.enabled||c.firebaseConfig?.projectId!=='belgiepd-test') process.exit(1);
          "
      - name: Read-only check whether leave feature is deployed to Render
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          base='https://belgiepd-beheerportaal-testserver.onrender.com'
          html_status=$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --max-time 35 "$base/verlofbeheer.html")
          api_status=$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --max-time 35 "$base/api/leave/me")
          echo "Render verlofbeheer.html HTTP $html_status"
          echo "Render unauthenticated /api/leave/me HTTP $api_status"
          if [[ "$html_status" == 200 && "$api_status" == 401 ]]; then
            echo "Leave page is available and API requires authentication"
          else
            echo "::warning::Verlofmodule staat nog niet aantoonbaar op Render; verwacht HTML 200 en API 401"
            exit 1
          fi
