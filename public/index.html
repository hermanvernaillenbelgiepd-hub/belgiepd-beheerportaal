/* BelgiëPD v0.4 - bestaande personeelsdossiers via Discord ID */
.profile-tabs{display:flex;gap:5px;overflow-x:auto;white-space:nowrap;padding:16px 0 10px;border-bottom:1px solid #e7ebf3;scrollbar-width:thin}
.profile-tab{border:1px solid transparent;background:transparent;border-radius:8px;color:#687995;padding:9px 11px;font-size:11px;font-weight:750;flex:none}
.profile-tab:hover{background:#f4f6ff;color:#3550cc}
.profile-tab.active{background:#eaf0ff;border-color:#d7e2ff;color:#2f50ce}
.profile-note{background:#f3f6ff;border:1px solid #e0e8ff;border-radius:10px;padding:13px 14px;margin:18px 0;color:#51648c;line-height:1.6;font-size:12px}
.profile-empty{padding:24px 15px;text-align:center;background:#f8faff;border:1px dashed #d9e2f3;border-radius:11px;color:#66758d;line-height:1.75;font-size:12px}
.profile-empty strong{display:block;color:#394861;font-size:13px;margin-bottom:5px}
.profile-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-top:13px}
.profile-meta>div{padding:13px;background:#f7f9fd;border:1px solid #edf0f7;border-radius:10px;min-width:0}
.profile-meta small{display:block;color:#8292ad;font-size:10px;font-weight:700;margin-bottom:7px}
.profile-meta strong{display:block;line-height:1.45;font-size:12px;overflow-wrap:anywhere;color:#29364e}
.specialty-grid{display:grid;gap:9px;margin:15px 0}
.specialty-item{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid #edf0f5;border-radius:10px;padding:12px 13px;font-size:12px;color:#35445e}
.specialty-state{font-size:10px;font-weight:750;padding:6px 10px;border-radius:99px;background:#f1f4f8;color:#62718b;white-space:nowrap}
.specialty-state.yes{background:#e5f7ef;color:#17835b}.specialty-state.no{background:#f4f5f7;color:#7c879a}.specialty-state.other{background:#fff3df;color:#a76a16}
.profile-subheading{font-size:13px;font-weight:790;margin:22px 0 9px;color:#25334c}
.profile-timestamp{font-size:10px;color:#8a99ae;margin-top:6px}
@media(max-width:570px){.profile-meta{grid-template-columns:1fr 1fr}.profile-tab{padding:8px}.drawer{padding:19px}}
.staff-roster{min-width:1060px}.staff-roster thead th{padding:11px 12px}
.staff-roster tbody td{padding:10px 12px;vertical-align:middle}
.rank-insignia{display:block;width:82px;height:36px;object-fit:contain;object-position:left center}
.rank-unknown,.no-specialty{color:#99a5b7;font-size:12px}
.rank-name{white-space:normal;min-width:134px;font-weight:650;color:#20304d!important}
.roster-dept{display:block;margin-top:3px;color:#8a97aa;font-size:10px;font-weight:500}
.specialty-icons{display:flex;flex-wrap:wrap;gap:4px;min-width:96px;max-width:240px}
.specialty-pictogram{display:inline-flex;align-items:center;justify-content:center;width:29px;height:29px;border-radius:7px;border:1px solid #dce5f4;background:#eef4ff;font-size:17px;cursor:help}
.specialty-status-strip{display:flex;flex-wrap:nowrap;gap:7px;overflow-x:auto;max-width:min(550px,58vw);padding:5px 2px;scrollbar-width:thin}
.specialty-state{display:inline-flex;align-items:center;gap:4px;flex:0 0 auto;padding:4px 5px;border:1px solid #e4eafa;background:#f5f7fd;border-radius:8px;font-size:10px}
.specialty-symbol{font-size:15px}.specialty-name{font-weight:650;color:#475775}
.specialty-state-value{border-radius:6px;padding:2px 5px;font-size:10px;font-weight:750}
.specialty-yes{background:#dbf6e9;color:#10734b}
.specialty-no{background:#e9edf3;color:#6b7788}
.specialty-stage{background:#fff0d5;color:#976009}
.specialty-teacher{background:#d3f7f8;color:#007481}
.specialty-unknown{background:#ebeff9;color:#687a9d}
.roster-attribution{font-size:10px;color:#77869e;padding:8px 18px 13px;line-height:1.4}
.roster-attribution a{text-decoration:underline}
</style>

async function loadDossierForCurrent(){
  if(!liveMode || !firebaseBridge?.auth?.currentUser) return;
  const x=employees.find(p=>p.id===drawer);
  if(!x || drawerTab!=='dossier' || dossierState[x.id]) return;
  dossierState[x.id]={status:'laden'};
  renderLayer();
  const targetId=x.id;
  try {
    const token=await firebaseBridge.auth.currentUser.getIdToken();
    const r=await fetch('/api/dossiers/'+encodeURIComponent(x.dept)+'/'+encodeURIComponent(x.personId||''),{headers:{Authorization:'Bearer '+token},cache:'no-store'});
    const data=await r.json();
    dossierState[targetId]=r.status===403?{status:'forbidden'}:r.ok?data:{status:'error'};
  } catch {dossierState[targetId]={status:'error'};}
  if(drawer===targetId&&drawerTab==='dossier') renderLayer();
}
function closeLayer(){drawer=null;modal=null;renderLayer()}
function changePage(p){page=restrictedPortal?'dashboard':p;query='';document.getElementById('globalSearch').value='';drawer=null;modal=null;document.getElementById('sidebar').classList.remove('open');document.getElementById('mobileShade').classList.remove('on');render();window.scrollTo({top:0,behavior:'instant'})}
function safeURL(s){try{const u=new URL(s);return (u.protocol==='https:'&&u.hostname.includes('.'))?u.href:null}catch{return null}}
function escapeTxt(s){return String(s).replace(/[\r\n\t]/g,' ').slice(0,800)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-page],[data-person],[data-profile-tab],[data-action],[data-close],[data-report],[data-doc],[data-notif],[data-dept],[data-export],[data-dossier-open]');if(!t)return;if(t.dataset.page){changePage(t.dataset.page);return}if(t.dataset.person){drawer=t.dataset.person;drawerTab='algemeen';renderLayer();return}if(t.dataset.profileTab){drawerTab=t.dataset.profileTab;renderLayer();if(drawerTab==='dossier')loadDossierForCurrent();return}if(t.dataset.dossierOpen){const record=dossierState[t.dataset.dossierOpen];const url=record?.status==='gekoppeld'?record.url:null;if(!url||!safeURL(url)||new URL(url).hostname!=='docs.google.com'){toast('Geen geldige dossierlink beschikbaar.');return}window.open(url,'_blank','noopener,noreferrer');return}if(t.dataset.close){if(e.target.closest('.drawer,.modal')&&!e.target.closest('button[data-close]'))return;closeLayer();return}if(t.dataset.report){modal='report:'+t.dataset.report;renderLayer();return}if(t.dataset.notif){let n=messages.find(x=>x.id===t.dataset.notif);if(n)n.seen=true;render();toast('Melding gemarkeerd als gelezen.');return}if(t.dataset.dept){selectedDepartment=t.dataset.dept;changePage('activiteiten');return}if(t.dataset.export){let r=reports.find(x=>x.id===t.dataset.export);if(!r)return;let content=['BelgiëPD demonstratierapport','NIET VOOR PRODUCTIE','',r.title,r.period,'Dienst: '+departments[r.dept].name,'Type: '+r.category,'Status: '+r.status,'',r.description].join('\n');let blob=new Blob([content],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='BPD-demo-rapport.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}if(t.dataset.doc){const d=docs.find(x=>x.id===t.dataset.doc);if(!d)return;if(!d.url){toast('Dit voorbeeld heeft nog geen online link. Voeg via Document toevoegen zelf een demonstratielink toe.');return}const url=safeURL(d.url);if(!url){toast('Onveilige of ongeldige link.');return}window.open(url,'_blank','noopener,noreferrer');return}if(t.dataset.action){switch(t.dataset.action){case 'new-report':if(liveMode){if(canWriteReports())window.location.assign('/weekrapporten.html#weekrapporten');else toast('Geen toegang tot weekrapporten.');return}if(!canWriteReports()){toast('Geen toegang tot weekrapporten.');return}modal='new-report';renderLayer();break;case 'new-doc':if(liveMode){toast('Documentencentrum is nog niet aangesloten.');return}modal='new-doc';renderLayer();break;case 'unavailable':toast('In de eerste prototypeversie wordt de personeelslijst alleen ingelezen.');break;case 'word-import':toast('Word-import komt na aansluiting van een beveiligde Google Drive-map. Dit prototype wijzigt geen bestanden.');break;case 'read-all':messages.forEach(x=>x.seen=true);toast('Demomeldingen gemarkeerd als gelezen.');render();break;default:break}}});
document.addEventListener('submit',e=>{if(e.target.id==='reportForm'){e.preventDefault();if(liveMode){toast('Weekrapporten zijn nog niet aangesloten.');return}let el=id=>document.getElementById(id);reports.unshift({id:'r'+Date.now(),title:escapeTxt(el('repTitle').value),period:escapeTxt(el('repPeriod').value),category:el('repType').value,dept:el('repDept').value,description:el('repNote').value,status:'Concept',author:'Testgebruiker'});closeLayer();changePage('rapporten');toast('Demonstratieconcept toegevoegd. Verdwijnt zodra je de pagina herlaadt.')}if(e.target.id==='docForm'){e.preventDefault();if(liveMode){toast('Documentencentrum is nog niet aangesloten.');return}let el=id=>document.getElementById(id),url=safeURL(el('docUrl').value);if(!url){toast('Gebruik een geldige https://-link.');return}docs.unshift({id:'doc'+Date.now(),title:escapeTxt(el('docTitle').value),cat:el('docCat').value,dept:el('docDept').value,type:'Online link',url});closeLayer();changePage('documenten');toast('Demonstratielink toegevoegd voor deze sessie.')}});
document.addEventListener('change',e=>{let id=e.target.id;if(id==='deptFilter'){deptFilter=e.target.value;seriesFilter='all';render()}if(id==='statusFilter'){statusFilter=e.target.value;render()}if(id==='seriesFilter'){seriesFilter=e.target.value;render()}if(id==='activityDept'){selectedDepartment=e.target.value;render()}if(id==='reportFilter'){reportFilter=e.target.value;render()}if(id==='docFilter'){docFilter=e.target.value;render()}if(id==='roleSelect'){if(liveMode){toast('Live-rollen worden uitsluitend op de server ingesteld.');render();return}role=e.target.value;render();toast('Demonstratierol gewijzigd. Dit is geen echte beveiliging.')}});

async function initConnection(){
  if(location.protocol==='file:') {document.getElementById('authBtn').disabled=true;document.getElementById('authBtn').textContent='Open via server';return;}
  let config;
  try{const r=await fetch('/api/client-config',{cache:'no-store'});config=await r.json();}
  catch{document.getElementById('authBtn').disabled=true;document.getElementById('authBtn').textContent='Server niet actief';return;}
  if(!config.enabled){document.getElementById('authBtn').disabled=true;document.getElementById('authBtn').textContent='Firebase instellen';return;}
  try {
    const firebaseAppModule=await import('https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js');
    const authModule=await import('https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js');
    const firebaseApp=firebaseAppModule.initializeApp(config.firebaseConfig);
    const auth=authModule.getAuth(firebaseApp);
    const authButton=document.getElementById('authBtn');
    firebaseBridge={auth,authModule};
    async function refreshPendingApprovals(user){
      if(!user||!liveMode){pendingReview=null;return}
      try{
        const token=await user.getIdToken();
        const headers={Authorization:'Bearer '+token};
        const cRes=await fetch('/api/users/context',{headers,cache:'no-store'});
        if(!cRes.ok){pendingReview=null;return}
        const ctx=await cRes.json();
        if(!ctx.canManageUsers){
          pendingReview=['officierenkader','korpsleiding','beheerder'].includes(ctx.role)?{kind:'limited'}:null;
        }else{
          const r=await fetch('/api/users/overview',{headers,cache:'no-store'});
          if(!r.ok){pendingReview=null;return}
          const data=await r.json();
          pendingReview={kind:'allowed',users:(data.users||[]).filter(x=>x.status==='pending')};
        }
      }catch{pendingReview=null}
      if(page==='dashboard')render();
    }
    async function loadData(user){
      const token=await user.getIdToken();
      const r=await fetch('/api/data',{headers:{Authorization:'Bearer '+token},cache:'no-store'});
      const payload=await r.json();
      if(!r.ok)throw new Error(payload.error||'Geen toegang');
      if(!Array.isArray(payload.employees))throw new Error('Ongeldige serverrespons');
      restrictedPortal=false;dossierState=Object.create(null);liveMode=true;liveInfo=payload;
      employees=payload.employees;
      role=payload.role;
      document.getElementById('sourceBadge').textContent=payload.stale?'VEROUDERDE BRON':'GOOGLE SHEETS · VERBONDEN';
      document.getElementById('sourceBadge').title='Laatst gelezen: '+(payload.fetchedAt||'onbekend');
      authButton.textContent='Afmelden';
      document.querySelector('.sidebar-profile strong').textContent='BelgiëPD-beheer';
      document.querySelector('.sidebar-profile small').textContent=(user.uid.startsWith('discord:')?'Discord-login · ':'Google-login · ')+payload.role;
      render();
      await refreshPendingApprovals(user);
    }
    authModule.onAuthStateChanged(auth,async user=>{
      if(user){try{await loadData(user);toast('Google Sheets gekoppeld: alleen lezen.');}
        catch(error){restrictedPortal=false;if(error.message?.includes('Basiskader heeft geen toegang')){restrictedPortal=true;liveMode=false;liveInfo=null;employees=[];role='basiskader';page='dashboard';document.getElementById('sourceBadge').textContent='BEPERKTE TOEGANG';document.querySelector('.sidebar-profile strong').textContent='BelgiumPD-portaal';document.querySelector('.sidebar-profile small').textContent='Personeelsinzage niet gemachtigd';render();return;}dossierState=Object.create(null);liveMode=false;liveInfo=null;pendingReview=null;employees=sampleEmployees.map(x=>({...x}));document.getElementById('sourceBadge').textContent='DEMO-MODUS';document.querySelector('.sidebar-profile strong').textContent='Testgebruiker';document.querySelector('.sidebar-profile small').textContent='Simulatie · geen live-toegang';render();toast('Geen live-toegang: '+error.message);}}
      else{restrictedPortal=false;dossierState=Object.create(null);liveMode=false;liveInfo=null;pendingReview=null;employees=sampleEmployees.map(x=>({...x}));role='korpsleiding';document.querySelector('.sidebar-profile strong').textContent='Testgebruiker';document.querySelector('.sidebar-profile small').textContent='Simulatie · geen login';authButton.textContent='Google aanmelden';document.getElementById('sourceBadge').textContent='DEMO-MODUS';render();}
    });
    const {setupPortalLogin}=await import('/portal-login.js');
    setupPortalLogin({button:authButton,auth,authModule,config,onError:error=>toast('Aanmelden mislukt: '+(error.code||error.message))});
    // Refresh bij open browser; server-cache vervalt na 15 minuten. Geen geplande cloudtaak in deze fase.
    setInterval(()=>{if(auth.currentUser&&liveMode)loadData(auth.currentUser).catch(()=>toast('Verversen mislukt; gegevens kunnen verouderd zijn.'));},15*60*1000);
  } catch {document.getElementById('authBtn').disabled=true;document.getElementById('authBtn').textContent='Firebase laden mislukt';}
}
initConnection();

})();
